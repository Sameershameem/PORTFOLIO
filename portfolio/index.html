<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
    <!--seo:start-->
    <title data-prerender>Sameer Shameem — Marketing, Content &amp; Digital Experiences</title>
    <meta data-prerender name="description" content="Sameer Shameem is a marketing specialist, content creator, performance marketer, copywriter, and emerging vibe coder." />
    <!--seo:end-->
    <style>
      /* Intro loader — inlined so it paints on the very first frame (see Loader.jsx). */
      html { scrollbar-gutter: stable; }
      html.is-scroll-locked, html.is-scroll-locked body { overflow: hidden; }
      .site-loader {
        /* --k must match the loader king size in Hero3DScene (min(34% of height, 320px)). */
        --k: min(34svh, 320px);
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        background: #f4f3ef; color: #1d1e1b; font-family: Montserrat, system-ui, sans-serif;
      }
      #site-loader { animation: kl-bail .5s 12s forwards; } /* safety net if the app never boots */
      #site-loader .kl-king { animation: kl-in 1s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes kl-bail { to { opacity: 0; visibility: hidden; } }
      @keyframes kl-in { from { opacity: 0; transform: translate(-50%, calc(-50% + 10px)); } }
      .kl-king {
        position: absolute; top: calc(48svh - var(--k) * .0444); left: 50%;
        width: auto; height: calc(var(--k) * 1.0889);
        transform: translate(-50%, -50%); fill: currentColor; overflow: visible;
      }
      .kl-shadow {
        position: absolute; top: calc(48svh + var(--k) * .5); left: 50%;
        width: calc(var(--k) * .66); height: calc(var(--k) * .09); transform: translate(-50%, -50%);
        border-radius: 50%; background: radial-gradient(closest-side, rgba(29, 30, 27, .18), rgba(29, 30, 27, 0));
      }
      .kl-meta {
        position: absolute; bottom: clamp(36px, 9svh, 84px); left: 50%;
        display: flex; flex-direction: column; align-items: center; gap: 14px; transform: translateX(-50%);
      }
      .kl-bar { position: relative; display: block; width: 140px; height: 1px; overflow: hidden; background: rgba(29, 30, 27, .14); }
      .kl-bar > span { position: absolute; inset: 0; background: #1d1e1b; transform: scaleX(0); transform-origin: 0 50%; }
      .kl-label { color: #77766f; font-size: 9px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
      .kl-count { margin-left: .9em; color: #1d1e1b; font-variant-numeric: tabular-nums; }
    </style>
    <noscript><style>#site-loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="site-loader" class="site-loader" aria-hidden="true">
      <span class="kl-shadow"></span>
      <svg class="kl-king" viewBox="-31 0 62 147"><path d="M27 147 L30 143 L29 138 L24 135 L20 131 L21 128 L18 127 L20 124.5 L17 122 L15 115 L13 97 L11.5 73 L18 64.5 L20 62 L18 59.5 L13 59 L14.5 47 L20 32 L22 27 L15 22 L2.5 22 L-2.5 22 L-15 22 L-22 27 L-20 32 L-14.5 47 L-13 59 L-18 59.5 L-20 62 L-18 64.5 L-11.5 73 L-13 97 L-15 115 L-17 122 L-20 124.5 L-18 127 L-21 128 L-20 131 L-24 135 L-29 138 L-30 143 L-27 147ZM-2.5 0h5v22h-5ZM-8.3 6.5h16.5v5h-16.5Z"/></svg>
      <div class="kl-meta">
        <span class="kl-bar"><span></span></span>
        <span class="kl-label">Sameer Shameem <span class="kl-count">000</span></span>
      </div>
    </div>
    <script>
      // The intro loader only plays on the home page.
      if (location.pathname !== '/') document.getElementById('site-loader').remove()
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">
        Sameer Shameem — marketing specialist, content creator, performance marketer and copywriter.
        Please enable JavaScript to view the full portfolio.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
